name: Build and test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run package:toolchain
      - uses: actions/upload-artifact@v4
        with:
          name: sketchpad-lab
          path: |
            dist
            artifacts/*.tgz
            Sketchpad-Lab.html
