name: Build, test, and deploy
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned test tooling
        run: |
          npm install --global --ignore-scripts typescript@5.9.3
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
          echo "CHROMIUM_EXECUTABLE=$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" >> "$GITHUB_ENV"
      - run: npm run check
      - run: npm test
      - run: npm run test:types
      - run: npm run build
      - name: Include the standalone app and notices
        run: cp Sketchpad-Lab.html LICENSE THIRD_PARTY_NOTICES.md dist/
      - run: npm run package:toolchain
      - run: npm run test:package
      - run: npm run package:hardware
      - run: npm run test:hardware-package
      - name: Archive the exact tested source
        run: |
          git archive --format=zip --output=artifacts/sketchpad-lab-source.zip HEAD
          git rev-parse HEAD > artifacts/source-commit.txt
          sha256sum artifacts/sketchpad-lab-source.zip > artifacts/source-SHA256SUMS.txt
      - run: npm run test:browser
      - run: npm run test:hardware-browser -- --gpu
      - run: python tests/resident_browser.py --require-gpu
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sketchpad-lab
          path: |
            dist
            artifacts/*.tgz
            artifacts/*.zip
            artifacts/*.txt
            Sketchpad-Lab.html
            test-results
      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
