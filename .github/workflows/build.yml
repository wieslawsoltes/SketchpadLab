name: Build, test, and deploy
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Include the standalone app and notices
        run: cp Sketchpad-Lab.html LICENSE THIRD_PARTY_NOTICES.md dist/
      - run: npm run package:toolchain
      - name: Archive the exact tested source
        run: |
          git archive --format=zip --output=artifacts/sketchpad-lab-source.zip HEAD
          git rev-parse HEAD > artifacts/source-commit.txt
          sha256sum artifacts/sketchpad-lab-source.zip > artifacts/source-SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: sketchpad-lab
          path: |
            dist
            artifacts/*.tgz
            artifacts/*.zip
            artifacts/*.txt
            Sketchpad-Lab.html
      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
